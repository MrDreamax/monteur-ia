<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Monteur</title>
<style>
/* Cockpit v3 « Claude te guide » (maquette validée le 23/10 : livrables/cockpit-montage/complet-r1/C, complet-r2/1c et 2b).
   Conversation à droite (23/10 : « mieux pour le contrôle »), vidéo au centre. Remplace Style Lab + Cut Notes. Ancienne page (v2, panneau de cartes) : _backup/2026-10-23-cockpit-v2/.
   Règle 23/10 : un look = polices + couleur du texte + rythme. JAMAIS d'étalonnage ni de filtre sur la vidéo du rush.
   Pas de zone qui défile dans la page : si la conversation est longue, c'est la page qui défile, la vidéo reste en place. */
:root{--bg:#f5f5f7;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#86868b;--line:rgba(0,0,0,.08);--blue:#0071e3;--green:#34c759;--red:#ff3b30;--yellow:#ffcc00;--orange:#ff9500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
.app{min-height:100vh;display:flex;flex-direction:column}
/* barre du haut, translucide, collée en haut quand la page défile */
.bar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:-.01em}.brand img{width:20px}
.proj{color:var(--ink3);font-size:13px}.sp{flex:1}
.btn{border-radius:980px;padding:7px 16px;font-weight:600;font-size:13px;background:rgba(0,0,0,.06);transition:transform .1s ease-out;text-decoration:none;color:var(--ink);display:inline-block}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.blue{background:var(--blue);color:#fff}
.main{flex:1;display:flex;align-items:flex-start}
/* ---------- la conversation ---------- */
.chat{order:2;width:420px;flex:none;min-height:calc(100vh - 56px);background:rgba(255,255,255,.8);border-left:.5px solid var(--line);display:flex;flex-direction:column;padding:18px 18px 14px}
#fil{display:flex;flex-direction:column;gap:10px;padding-bottom:16px}
.who{font-size:11px;color:var(--ink3);font-weight:600;margin:4px 0 -6px 4px;letter-spacing:.02em}
.who.moi{align-self:flex-end;margin-right:4px}
.msg{max-width:92%;font-size:14px;line-height:1.4;padding:10px 13px;border-radius:16px;background:#fff;box-shadow:0 0 0 .5px var(--line);transition:box-shadow .15s}
.msg.large{max-width:100%}
.msg.on{box-shadow:0 0 0 2px var(--blue)}
.msg.moi{align-self:flex-end;background:var(--blue);color:#fff;box-shadow:none}
.msg b{font-weight:600}
.msg .ch{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.msg small{display:block;color:var(--ink3);font-size:12px;margin-top:4px}
.attente{align-self:flex-end;font-size:11.5px;color:var(--ink3);margin:-4px 6px 0 0}
.pill{font-size:12px;font-weight:600;padding:5px 12px;border-radius:980px;background:rgba(0,113,227,.1);color:var(--blue);white-space:nowrap;transition:transform .1s ease-out}
.pill:active:not(:disabled){transform:scale(.96)}
.pill.plein{background:var(--blue);color:#fff}.pill.gris{background:rgba(0,0,0,.06);color:var(--ink)}.pill.rouge{background:var(--red);color:#fff}
.pill.fait{background:rgba(52,199,89,.14);color:#248a3d;cursor:default}
.tc{font-size:11px;font-weight:700;color:var(--blue);background:rgba(0,113,227,.1);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums;flex:none;margin-right:6px}
.msg.moi .tc{background:rgba(255,255,255,.22);color:#fff}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(0,113,227,.2);border-top-color:var(--blue);animation:t .9s linear infinite;flex:none;display:inline-block;vertical-align:-3px;margin-right:6px}
@keyframes t{to{transform:rotate(360deg)}}
/* les 3 looks */
.looks{display:flex;gap:9px;margin-top:9px}
.lk{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:600;line-height:1.25;display:flex;flex-direction:column;justify-content:flex-start}
.lk .v{height:150px;border-radius:10px;background:#000 center/cover;position:relative;overflow:hidden;margin-bottom:6px;transition:box-shadow .15s}
.lk.on .v{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.lk small{font-weight:400;color:var(--ink3);font-size:10.5px;margin-top:1px}
.reg{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;flex-wrap:wrap}.reg>b{width:62px;font-weight:600;color:var(--ink2);font-size:12px;flex:none}
.dot{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25);transition:box-shadow .15s}.dot.on{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25),0 0 0 2px #fff,0 0 0 4px var(--blue)}
/* 23/10 personnalisation : galerie des 6 polices au centre + 5 réglages qui se déplient (maquettes perso-r1 validées) */
.galerie{display:grid;grid-template-columns:repeat(3,auto);gap:14px 28px}
.galerie button{text-align:center;font-size:13px;font-weight:600;line-height:1.3}
.galerie .v{border-radius:14px;background:#000 center/cover;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.16);margin-bottom:7px;transition:box-shadow .15s}
.galerie button.on .v{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--blue)}
.galerie small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.acc{background:var(--bg);border-radius:12px;margin-top:8px}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:14px;text-align:left}
.acc>button b{font-weight:600;white-space:nowrap}.acc>button span{margin-left:auto;color:var(--ink3);font-size:12.5px;text-align:right}
.acc .in{padding:0 14px 12px}.acc .in .reg:first-child{margin-top:0}
.coul{width:24px;height:24px;border-radius:50%;border:0;padding:0;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);cursor:pointer;-webkit-appearance:none;appearance:none;overflow:hidden}
.coul::-webkit-color-swatch-wrapper{padding:0}.coul::-webkit-color-swatch{border:0;opacity:0}
/* les 3 ouvertures */
.cprev{display:flex;gap:8px;margin-top:8px}
.cprev button{width:64px;height:114px;border-radius:8px;background:#000 center/cover;position:relative;overflow:hidden;flex:none;transition:box-shadow .15s}
.cprev button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.cprev button>span{position:absolute;left:0;right:0;bottom:3px;text-align:center;color:#fff;font-size:9px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.8);z-index:2}
.seg{display:inline-flex;background:rgba(0,0,0,.06);border-radius:980px;padding:2px}
.seg button{font-size:12px;font-weight:500;padding:3px 10px;border-radius:980px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.ask{position:sticky;bottom:14px;margin-top:auto;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:7px 7px 7px 12px;box-shadow:0 0 0 .5px var(--line),0 6px 20px rgba(0,0,0,.06);flex:none}
.ask .tc{margin:0}
#dis{flex:1;min-width:0;font-size:14px;outline:none}#dis::placeholder{color:var(--ink3)}
.mic{width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.mic.on{box-shadow:0 0 0 5px rgba(0,113,227,.2)}
/* ---------- la scène : collée sous la barre, ne défile pas avec la conversation ---------- */
.stage{flex:1;min-width:0;height:calc(100vh - 56px);position:sticky;top:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px 20px 34px}
.phone{border-radius:34px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.22),0 0 0 6px #fff,0 0 0 7px rgba(0,0,0,.08);position:relative;flex:none}
.scr{width:100%;height:100%;position:relative}
.scr video{width:100%;height:100%;object-fit:cover;display:block}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.play{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.play b{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;transition:opacity .2s}
.play b:after{content:"";border-left:17px solid #1d1d1f;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px}
.joue .play b{opacity:0}
/* zones interdites d'Instagram (règle 16/10, toutes les vidéos) : en rouge quand la vidéo est en pause ; le Gardien bloque tout texte dedans */
.zones{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;transition:opacity .2s}
.joue .zones{opacity:0}
/* calques de l'aperçu : polices et couleurs du look (variables posées sur le téléphone ou la vignette) */
.cap{position:absolute;left:4%;right:4%;text-align:center;font-family:var(--sans);font-weight:700;color:var(--txt,#fff);text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.6);line-height:1.05}
.kw{position:absolute;left:3%;right:3%;text-align:center;font-family:var(--serif);font-style:italic;color:var(--sercol,#fff);line-height:1;text-shadow:0 0 18px rgba(255,255,255,.25),0 3px 14px rgba(0,0,0,.5)}
.ht{position:absolute;left:0;right:0;text-align:center;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.55);background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.5) 22%,rgba(0,0,0,.5) 78%,rgba(0,0,0,0))}
.ht1{font-family:var(--sans);font-weight:700;text-transform:uppercase;letter-spacing:.5px;line-height:1.2}
.ht2{font-family:var(--serif);font-style:italic;line-height:1.05;color:var(--sercol,#fff)}
.ht.sty{background:none;text-shadow:0 4px 26px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.35)}
.ht.sty.forte,.cap.forte{text-shadow:0 0 3px rgba(0,0,0,.9),0 3px 8px rgba(0,0,0,.75),0 8px 30px rgba(0,0,0,.6)}
.bw{position:absolute;left:0;right:0;text-align:center;font-family:var(--serif);font-style:italic;color:var(--sercol,#fff);line-height:1.22;text-shadow:0 10px 60px rgba(0,0,0,.25);white-space:nowrap}
.cart{position:absolute;inset:0;z-index:3;overflow:hidden}
.mxh{position:absolute;left:0;right:0;display:flex;justify-content:center;animation:bat .75s ease-in-out infinite;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
@keyframes bat{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}}
.mxc{position:absolute;text-align:center;font-family:var(--sans);font-weight:800;line-height:1}
.mxw{position:absolute;text-align:center;font-family:var(--sans);font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--sercol,#F2D37A);text-shadow:0 2px 6px rgba(0,0,0,.55)}
.mxt{position:absolute;filter:drop-shadow(0 3px 8px rgba(0,0,0,.55))}
.mxl{position:absolute;font-family:var(--sans);font-weight:600;text-transform:uppercase;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55)}
.mv2{grid-template-columns:repeat(2,1fr)}.mvn{font:800 34px/1 -apple-system,system-ui;color:#fff}.mvn i{font-style:normal;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.7);margin-left:4px}
.mvi{width:64px;height:54px;object-fit:contain}
.ils{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.il{height:58px;border-radius:9px;background:#0f1522;display:grid;place-items:center}.il.on{box-shadow:0 0 0 2.5px var(--blue)}.il .mvi{width:52px;height:44px}
.bw.devant{text-shadow:0 0 4px rgba(0,0,0,.85),0 4px 14px rgba(0,0,0,.7),0 12px 60px rgba(0,0,0,.6)}
.ctrl{display:flex;align-items:center;gap:14px;color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.rond{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);display:grid;place-items:center;flex:none}
/* la bande : coupes rouges numérotées en haut, notes bleues en bas */
.strip{display:flex;height:58px;border-radius:10px;border:3px solid var(--yellow);position:relative;background:#000;cursor:pointer;touch-action:none}
.strip .fr{height:52px;flex:1;background-size:cover;background-position:center}
.strip .fr:first-child{border-radius:6px 0 0 6px}.strip .fr:last-of-type{border-radius:0 6px 6px 0}
.tick,.pin{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;border-radius:2px;box-shadow:0 0 0 1.5px rgba(255,255,255,.8);cursor:pointer}
.tick{background:var(--red)}.pin{background:var(--blue);width:3px;margin-left:-1.5px}
.tick::before{content:"";position:absolute;inset:-26px -9px 0}.pin::before{content:"";position:absolute;inset:0 -9px -26px}
.tick i,.pin i,.remis i{position:absolute;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;color:#fff;font:700 11px/20px -apple-system,system-ui;text-align:center;font-style:normal;transition:box-shadow .15s}
.tick i,.remis i{top:-25px;background:var(--red);box-shadow:0 2px 6px rgba(255,59,48,.35)}
.pin i{bottom:-25px;background:var(--blue);box-shadow:0 2px 6px rgba(0,113,227,.35)}
.tick.on i,.remis.on i,.pin.on i{box-shadow:0 0 0 3px rgba(0,113,227,.4)}
.remis{position:absolute;top:-3px;bottom:-3px;background:rgba(255,204,0,.28);border-left:2px solid var(--orange);border-right:2px solid var(--orange);cursor:pointer}
.remis i{background:var(--orange)}
.ph{position:absolute;top:-10px;bottom:-10px;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 1px 4px rgba(0,0,0,.3);pointer-events:none}
.kbd{font-size:11px;color:var(--ink3)}.kbd b{font-weight:600;border:1px solid rgba(0,0,0,.15);border-bottom-width:2px;border-radius:5px;padding:0 6px;margin-right:4px;color:var(--ink2);background:#fff}
/* écouter un passage coupé : le téléphone passe sur le rush */
.scr #v-rush{position:absolute;inset:0;z-index:2}
.ecoute{position:absolute;top:14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:#fff;background:rgba(255,59,48,.92);padding:6px 12px;border-radius:980px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:3}
.ecbar{position:absolute;left:18px;right:18px;bottom:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);z-index:3}.ecbar i{display:block;width:0;height:100%;border-radius:2px;background:#fff}
.recoupe{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font-size:15px;font-weight:600;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.recoupe .spin{width:28px;height:28px;border-color:rgba(255,255,255,.3);border-top-color:#fff;margin:0}
.recoupe small{font-size:12px;font-weight:500;opacity:.8}
/* ---------- la planche des 6 contenus ---------- */
.planche{display:flex;flex-direction:column;align-items:center;gap:24px}
.planche h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.planche .sous{color:var(--ink2);font-size:13px;margin-top:-16px;font-variant-numeric:tabular-nums}
.board{display:flex;gap:16px;align-items:flex-end}
.it{text-align:center;font-size:12.5px;font-weight:600;transition:opacity .2s}
.it.off{opacity:.45}
.it .v{border-radius:14px;background:#000 center/cover;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.16);margin:0 auto 7px}
.it small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px;margin-top:1px;white-space:nowrap}
.it .date{color:var(--blue);font-weight:500;cursor:pointer;position:relative}
.it .date input{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
.it .tog{position:absolute;top:8px;right:8px;z-index:3}
.etat{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(0,0,0,.35);color:#fff;font-size:22px;font-weight:700}
.etat .spin{width:26px;height:26px;border-color:rgba(255,255,255,.3);border-top-color:#fff;margin:0}
.etat.ok{background:none;place-items:end start;padding:8px}.etat.ok b{width:24px;height:24px;border-radius:50%;background:var(--green);font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.etat.ko{background:rgba(255,59,48,.45)}
.tog{width:38px;height:23px;border-radius:12px;background:rgba(0,0,0,.25);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.tog.on{background:var(--green)}.tog.on::after{transform:translateX(15px)}
.res{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink3)}
.res button{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:980px;background:rgba(0,0,0,.05);color:var(--ink3)}
.res button.on{background:rgba(0,113,227,.12);color:var(--blue)}
.pied{display:flex;gap:10px}.pied .btn{padding:11px 20px;font-size:15px}
.alerte{font-size:12.5px;color:#c93400;margin-top:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:rgba(29,29,31,.9);color:#fff;backdrop-filter:blur(20px);padding:10px 18px;border-radius:980px;font-size:14px;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1);pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 23/10 montage en 3 étapes (maquettes passes-r1 validées : A « étapes en haut » + r2-3b « moments forts ») */
.steps{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px}
.st{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:980px;font-size:13px;background:rgba(0,0,0,.04);white-space:nowrap;transition:background .15s}
.st i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;background:rgba(0,0,0,.1);color:var(--ink2)}
.st.on{background:rgba(0,113,227,.1);color:var(--blue);font-weight:600}.st.on i{background:var(--blue);color:#fff}
.st.ok i{background:var(--green);color:#fff}.st small{color:var(--ink3);font-size:12px;font-weight:400}.st u{color:var(--blue);text-decoration:none;font-size:12px;font-weight:600}
.steps .fl{color:var(--ink3);font-size:12px}
.btn.noir{background:#1d1d1f;color:#fff}
.suivant{display:block;width:100%;margin-top:4px;padding:11px;border-radius:980px;background:var(--blue);color:#fff;font-weight:600;font-size:14px;transition:transform .1s ease-out}
.suivant:active{transform:scale(.98)}
.sous-suivant{font-size:12px;color:var(--ink3);text-align:center;margin-top:-2px}
.chip{font-size:12px;font-weight:500;padding:5px 9px;border-radius:980px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--blue);color:#fff;box-shadow:none;font-weight:600}
.chip:disabled{opacity:.45}
.mk{position:absolute;bottom:-3px;width:3px;margin-left:-1.5px;top:-3px;background:var(--blue);border-radius:2px;cursor:pointer}
.mk::before{content:"";position:absolute;inset:0 -9px -26px}
.mk i{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font:700 11px/20px -apple-system,system-ui;text-align:center;font-style:normal;box-shadow:0 2px 6px rgba(0,113,227,.35)}
.scr #v-broll{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cache{display:none!important}
body.lab #steps,body.lab #auto,body.lab #exporter,body.lab #retour{display:none!important}   /* Derush Lab : la timeline seule */
/* étape 3 (maquettes etape3-r1 r1-a + r2-a) : la liste des moments, celui qu'on touche s'ouvre */
.l8{display:flex;flex-direction:column;gap:5px}
.mrow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;font-size:13px;background:#fff;box-shadow:0 0 0 .5px var(--line);text-align:left;width:100%}
.mrow b{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;display:grid;place-items:center;flex:none}
.mrow .tm{color:var(--ink3);font-size:12px;width:30px;flex:none}

// Plus de texte. En haut à gauche le téléphone joue le RUSH en sautant ce qui est coupé (montage virtuel, instantané) ; à droite la
// LOUPE : le bloc ouvert en grand (image + son) avec 1,6 s autour ; en bas le reel bout à bout, les coupes en PETIT (image + son en gris).

// se tirent aussi. ← → = 10 ms. Le son = courbe « Bourse » EXACTE (l’utilisateur : « très précis ») : la vraie valeur toutes les 10 ms, le pic

function blocs() {   // la suite du rush : gardé (k) ou coupé
  const out = []; let t = 0;
  for (const [a, b] of DR.plages) { if (a - t > 0.02) out.push({k: false, a: t, b: a}); out.push({k: true, a, b}); t = b; }
  if (DUR() - t > 0.02) out.push({k: false, a: t, b: DUR()});
  return out;
}
const garde = t => DR.plages.some(([a, b]) => t >= a && t < b);
function raison(c) {   // une coupe : par Claude (son 1er dérush) ou par toi ; reprise (des mots dedans) ou blanc
  const cl = E.derush.claude, dedans = (x, y) => Math.max(0, Math.min(y, c.b) - Math.max(x, c.a));
  let parClaude = c.b - c.a; cl.forEach(([a, b]) => { parClaude -= dedans(a, b); });
  const mots = E.rush_mots.some(w => (w.start + w.end) / 2 > c.a && (w.start + w.end) / 2 < c.b);
  return {claude: parClaude > (c.b - c.a) / 2, rep: mots, nom: mots ? "Reprise" : "Blanc"};
}
const dureeVirt = () => DR.plages.reduce((s, [a, b]) => s + b - a, 0);
function rushVersVirt(t) { let s = 0; for (const [a, b] of DR.plages) { if (t <= a) break; s += Math.min(t, b) - a; } return s; }
function virtVersRush(x) { for (const [a, b] of DR.plages) { if (x <= b - a) return a + x; x -= b - a; } return DR.plages.length ? DR.plages.at(-1)[1] : 0; }
// 29/10 (l’utilisateur : « entre chaque partie, une micro coupure de 0,05 s ») : le son du dérush joue en Web Audio, les plages
// gardées collées à l'échantillon près ; la vidéo, muette, suit l'horloge du son. Avant : la vidéo sautait d'une plage à
// l'autre (un saut = 30 à 100 ms de trou). Son pas encore chargé (ou navigateur qui refuse) = l'ancien saut, en secours.
const AUD = {ctx: null, buf: null, charge: false, srcs: [], on: false, x0: 0, c0: 0, sig: "", seek: 0, user: false};
async function chargerSonDR() {
  if (AUD.buf || AUD.charge) return; AUD.charge = true;
  try {
    AUD.ctx = new AudioContext({sampleRate: 24000});
    AUD.buf = await AUD.ctx.decodeAudioData(await (await fetch("/video/rush")).arrayBuffer());
  } catch (e) { AUD.buf = null; console.warn("son du dérush : secours = saut de la vidéo", e); }
}
function sonStop() {
  AUD.srcs.forEach(s => { try { s.stop(); } catch (e) {} }); AUD.srcs = []; AUD.on = false;
  const v = $("#v-reel"); if (v) v.muted = false;
}
function sonDepuis(t) {   // les plages gardées bout à bout, depuis l'instant t du rush
  sonStop(); const v = $("#v-reel"), R = DR.plages; if (!AUD.buf || !v || !R.length) return false;
  const i = R.findIndex(([a, b]) => t < b - 0.01); if (i < 0) return false;
  const c = AUD.ctx, F = 0.004; if (c.state === "suspended") c.resume();
  let quand = c.currentTime + 0.03, deb = Math.max(t, R[i][0]);
  AUD.x0 = rushVersVirt(deb); AUD.c0 = quand; AUD.sig = JSON.stringify(R); AUD.on = true; v.muted = true;
  for (let k = i; k < R.length; k++, deb = R[k] ? R[k][0] : 0) {
    const d = R[k][1] - deb; if (d <= 0.001) continue;
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = AUD.buf; s.connect(g).connect(c.destination);
    if (d > 4 * F) {   // anti-clic de 4 ms à chaque raccord (derush.py en fait autant), jamais de blanc
      g.gain.setValueAtTime(0, quand); g.gain.linearRampToValueAtTime(1, quand + F);
      g.gain.setValueAtTime(1, quand + d - F); g.gain.linearRampToValueAtTime(0, quand + d);
    }
    s.start(quand, deb, d); AUD.srcs.push(s); quand += d;
  }
  return true;
}
function sonSuit(v) {   // la vidéo suit l'horloge du son ; true = c'est le son qui mène
  if (rejoue && rejoue.brut) { if (AUD.on) sonStop(); return false; }
  if (!AUD.on) return false;
  if (AUD.user || AUD.sig !== JSON.stringify(DR.plages)) { AUD.user = false; return sonDepuis(v.currentTime); }
  const x = AUD.x0 + Math.max(0, AUD.ctx.currentTime - AUD.c0);
  if (rejoue && x >= rejoue.fin) { v.pause(); rejoue = null; return true; }
  if (x >= dureeVirt() - 0.005) { v.pause(); v.currentTime = DR.plages.length ? DR.plages[0][0] : 0; return true; }
  const tr = virtVersRush(x);
  if (Math.abs(v.currentTime - tr) > 0.15 || !garde(v.currentTime)) { AUD.seek++; v.currentTime = tr; }
  return true;
}
function sautVirtuel(v) {
  if (sonSuit(v)) return;
  const t = v.currentTime;
  if (rejoue && rejoue.brut) { if (t >= rejoue.fin) { v.pause(); rejoue = null; } return; }   // « Écouter » un bout : le rush tel quel
  if (rejoue && rushVersVirt(t) >= rejoue.fin) { v.pause(); rejoue = null; return; }
  const R = DR.plages;
  if (R.some(([a, b]) => t >= a - 0.005 && t < b - 0.01)) return;
  const n = R.find(([a]) => a > t - 0.01);
  if (n) v.currentTime = n[0]; else { v.pause(); v.currentTime = R.length ? R[0][0] : 0; }
}
function rejouerAutour(e) {   // après un geste : 1 s avant, 1 s après (montage virtuel)
  const v = $("#v-reel"); if (!v) return;
  const x = rushVersVirt(e); rejoue = {fin: x + 1};
  v.currentTime = virtVersRush(Math.max(0, x - 1)); v.play();
}
function ouvrir(t, garderVue) {   // ouvre dans la loupe le bloc qui contient t
  const b = blocs().find(x => t >= x.a && t < x.b) || blocs().at(-1);
  ouvertT = (b.a + b.b) / 2;
  if (!garderVue) vue = {t0: Math.max(0, b.a - CTX), t1: Math.min(DUR(), b.b + CTX)};
  sel = null; marque = null;
}
const blocOuvert = () => blocs().find(x => ouvertT >= x.a && ouvertT < x.b) || blocs()[0];
const coupes = () => blocs().filter(x => !x.k);

// ----- dessin du son : courbe « Bourse » exacte -----
function niveauxPixels(t0, t1, W) {   // 1 valeur par pixel : le pic des tranches de 10 ms du pixel (jamais lissé) ; zoom fort = valeur interpolée
  const v = new Float32Array(W), n = ONDE.length;
  for (let x = 0; x < W; x++) {
    const ta = (t0 + (t1 - t0) * x / W) * 100, tb = (t0 + (t1 - t0) * (x + 1) / W) * 100;
    if (tb - ta >= 1) { let m = 0; for (let k = Math.floor(ta); k < Math.min(n, Math.ceil(tb)); k++) m = Math.max(m, ONDE[k] || 0); v[x] = m; }
    else { const k = Math.floor(ta), f = ta - k; v[x] = (ONDE[Math.min(n - 1, k)] || 0) * (1 - f) + (ONDE[Math.min(n - 1, k + 1)] || 0) * f; }
  }
  return v;
}
function courbe(g, x0, y0, W, H, t0, t1, zonesBleues) {

  const v = niveauxPixels(t0, t1, Math.round(W)), haut = H * 0.06, Y = k => y0 + H - 1 - v[k] * (H - 1 - haut);
  const trace = () => { g.beginPath(); g.moveTo(x0, Y(0)); for (let k = 1; k < v.length; k++) g.lineTo(x0 + k, Y(k)); };
  const peindre = (c1, c0, trait, lw) => {
    trace(); g.lineTo(x0 + v.length - 1, y0 + H); g.lineTo(x0, y0 + H); g.closePath();
    const gr = g.createLinearGradient(0, y0, 0, y0 + H); gr.addColorStop(0, c1); gr.addColorStop(1, c0); g.fillStyle = gr; g.fill();
    trace(); g.strokeStyle = trait; g.lineWidth = lw; g.lineJoin = "round"; g.lineCap = "round"; g.stroke();
  };
  peindre("rgba(174,174,178,.30)", "rgba(174,174,178,0)", "#c7c7cc", 1.2);
  g.save(); g.beginPath(); zonesBleues.forEach(([a, b]) => g.rect(a, y0 - 2, b - a, H + 4)); g.clip();
  peindre("rgba(0,113,227,.32)", "rgba(0,113,227,0)", "#0071e3", 1.6);
  g.restore();
}
function film(g, x0, y0, W, h, t0, t1, gris) {   // les images du rush (planche 2 images / s)

  if (gris) { g.filter = "grayscale(1)"; g.globalAlpha = 0.45; }

    g.drawImage(SPR, (f % P.cols) * P.w, Math.floor(f / P.cols) * P.h, P.w, P.h, x0 + x, y0, sw, h);

}
function hachures(g, x, y, w, h) {

  for (let k = -h; k < w; k += 12) { g.beginPath(); g.moveTo(x + k, y + h); g.lineTo(x + k + 6, y + h); g.lineTo(x + k + 6 + h, y); g.lineTo(x + k + h, y); g.fill(); }

// ----- la loupe -----
let LG = null;   // géométrie de la loupe : {W, hv, ha}
const tX = t => (t - vue.t0) / (vue.t1 - vue.t0) * LG.W, xT = x => vue.t0 + (vue.t1 - vue.t0) * x / LG.W;
function regleTL(t0, t1, W) {
  const pas = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 30].find(p => p / (t1 - t0) * W >= 64) || 60, out = [];
  const mini = pas / 5, dec = pas < 0.1 ? 2 : pas < 1 ? 1 : 0;
  for (let t = Math.ceil(t0 / mini) * mini; t <= t1 + 1e-9; t += mini) {
    const x = (t - t0) / (t1 - t0) * W, big = Math.abs(t / pas - Math.round(t / pas)) < 1e-6;
    out.push(`<i style="left:${x.toFixed(1)}px;height:${big ? 8 : 4}px"></i>`);
    if (big) out.push(`<span style="left:${x.toFixed(1)}px">${t.toFixed(dec).replace(".", ",")} s</span>`);
  }

}
function dessinerLoupe() { peindreLoupe(); calqueLoupe(); }
function peindreLoupe() {   // le canvas, la règle, les étiquettes (jamais les éléments qu'on tire : ils perdraient le doigt)
  const cv = $("#tl-cv"); if (!cv || !vue) return;
  const [g, W] = canvasPret(cv), {hv, ha} = LG; LG.W = W;
  const bl = blocs(), R = DR.plages;
  film(g, 0, 0, W, hv, vue.t0, vue.t1, false);
  g.fillStyle = "#fbfbfd"; g.beginPath(); g.roundRect(0, hv + 8, W, ha, 8); g.fill();
  const bleus = R.filter(([a, b]) => b > vue.t0 && a < vue.t1).map(([a, b]) => [Math.max(0, tX(a)), Math.min(W, tX(b))]);
  courbe(g, 0, hv + 8, W, ha, vue.t0, vue.t1, bleus);
  bl.filter(b => !b.k && b.b > vue.t0 && b.a < vue.t1).forEach(b => {   // le coupé : image pâlie, son en gris
    const x = Math.max(0, tX(b.a)), w = Math.min(W, tX(b.b)) - x;
    g.fillStyle = "rgba(245,245,247,.62)"; g.fillRect(x, 0, w, hv); hachures(g, x, 0, w, hv);
  });
  $("#tl-regle").innerHTML = regleTL(vue.t0, vue.t1, W);
  $("#tl-labels").innerHTML = bl.filter(b => b.b > vue.t0 && b.a < vue.t1).map(b => {
    const x = (Math.max(0, tX(b.a)) + Math.min(W, tX(b.b))) / 2, r = b.k ? null : raison(b);
    return `<span class="tag ${b.k ? "bl" : "rep"}" style="left:${x}px">${b.k ? "gardé" + (b.b - b.a < 2 ? " · " + sec(b.b - b.a) + " (2 s min)" : "") : `✂ coupé par ${r.claude ? "Claude" : "toi"} · ${r.nom} ${sec(b.b - b.a)}`}</span>`;
  }).join("");

  $("#tl-titre").textContent = b.k ? `Bloc gardé ${n} en grand` : `Coupe ${n} en grand`;
  $("#tl-tout").textContent = b.k ? "🗑 Supprimer ce bloc" : "Tout remettre";   // 29/10 l’utilisateur : « je ne peux pas supprimer un bout que tu as gardé »

function calqueLoupe() {   // bords des blocs (tirables), sélection et ses poignées, la barre « Remettre / Retirer »
  if (!$("#tl-over") || !vue) return;
  const {hv, ha, W} = LG, bl = blocs(), R = DR.plages;
  let h = "";
  R.forEach(([a, b], i) => [["a", a], ["b", b]].forEach(([c, t]) => {
    if (t < vue.t0 || t > vue.t1 || (c === "a" && t < 0.01) || (c === "b" && t > DUR() - 0.01)) return;
    const on = actif && actif.bord && actif.bord[0] === i && actif.bord[1] === c;
    h += `<div class="tl-bord ${on ? "on" : ""}" data-i="${i}" data-c="${c}" style="left:${tX(t).toFixed(1)}px"><b style="top:${hv + 8 + ha / 2 - 22}px"></b></div>`;
  }));
  if (sel) {
    const x0 = tX(sel.a), x1 = tX(sel.b), surCoupe = bl.some(b => !b.k && b.b > sel.a + 0.01 && b.a < sel.b - 0.01), surGarde = R.some(([a, b]) => b > sel.a + 0.01 && a < sel.b - 0.01);
    h += `<div class="tl-sel" style="left:${x0}px;width:${x1 - x0}px"></div>
      <span class="tl-poi ${actif && actif.sel === "a" ? "on" : ""}" data-s="a" style="left:${x0}px;top:${hv + 8 + ha / 2 - 22}px"></span><span class="tl-poi ${actif && actif.sel === "b" ? "on" : ""}" data-s="b" style="left:${x1}px;top:${hv + 8 + ha / 2 - 22}px"></span>
      <div class="flot" style="left:${Math.min(W - 150, Math.max(150, (x0 + x1) / 2))}px">${surCoupe ? `<button class="b" id="tl-remettre">↺ Remettre ce bout · ${sec(sel.b - sel.a)}</button>` : ""}${surGarde ? `<button class="${surCoupe ? "" : "r"}" id="tl-retirer">✂ Retirer${surCoupe ? "" : " ce bout · " + sec(sel.b - sel.a)}</button>` : ""}<button id="tl-ecoute">▶ Écouter</button></div>`;
  }
  if (marque != null && marque >= vue.t0 && marque <= vue.t1) h += `<div class="tl-marque" style="left:${tX(marque)}px"></div>`;
  $("#tl-over").innerHTML = h + '<div class="tete prise" id="tl-tete"><b></b></div>';
  brancherLoupe(); brancherTete("#tl-tete", "#tl-zone", xT);

function placerSel() {   // pendant qu'on tire une poignée de la sélection : on déplace, on ne redessine pas
  const x0 = tX(sel.a), x1 = tX(sel.b), s = $(".tl-sel"), f = $(".flot");
  if (s) { s.style.left = x0 + "px"; s.style.width = x1 - x0 + "px"; }
  document.querySelectorAll(".tl-poi").forEach(p => p.style.left = (p.dataset.s === "a" ? x0 : x1) + "px");
  if (f) f.style.left = Math.min(LG.W - 150, Math.max(150, (x0 + x1) / 2)) + "px";

// ----- la vue d'ensemble : le reel bout à bout, les coupes en petit -----
let OV = null;   // [{k, a, b, x, w}]
const gw = d => d < 1 ? 18 : d < 3.5 ? 40 : 58;
function dessinerVue() {
  const cv = $("#ov-cv"); if (!cv) return;
  const [g, W, H] = canvasPret(cv), hv = Math.round(H * 0.55), ha = H - hv - 6, bl = blocs();
  const fixe = bl.filter(b => !b.k).reduce((s, b) => s + gw(b.b - b.a), 0), px = (W - fixe) / Math.max(0.1, dureeVirt());
  let x = 0; OV = bl.map(b => { const w = b.k ? (b.b - b.a) * px : gw(b.b - b.a), o = {...b, x, w}; x += w; return o; });
  OV.forEach(o => {
    const x0 = o.x + 1, w = o.w - 2;
    g.save(); g.beginPath(); g.roundRect(x0, 0, w, H, 7); g.clip();
    film(g, x0, 0, w, hv, o.a, o.b, !o.k);
    g.fillStyle = "#fbfbfd"; g.fillRect(x0, hv, w, H - hv);
    courbe(g, x0, hv + 6, w, ha, o.a, o.b, o.k ? [[x0, x0 + w]] : []);
    if (!o.k) hachures(g, x0, 0, w, H);
    g.restore();
  });
  const ob = blocOuvert();
  $("#ov-over").innerHTML = OV.map((o, n) => {
    const r = o.k ? null : raison(o), on = Math.abs(o.a - ob.a) < 1e-6, court = o.k && o.b - o.a < 2;
    return `<div class="ob ${o.k ? "k" : "c"} ${on ? "on" : ""} ${court ? "court" : ""}" data-t="${(o.a + o.b) / 2}" style="left:${o.x + 1}px;width:${o.w - 2}px"></div>`
      + (o.k ? (court ? `<span class="tag court" style="left:${o.x + o.w / 2}px;bottom:-26px">${sec(o.b - o.a)}</span>` : "")
        : `<span class="tag ${r.rep ? "rep" : "bl"} ${on ? "noir" : ""}" style="left:${o.x + o.w / 2}px;top:-26px">✂${o.w > 30 ? " " + sec(o.b - o.a) : ""}</span>`);
  }).join("") + '<div class="tete prise" id="ov-tete"><b></b><div class="vign"></div></div>';
  brancherTete("#ov-tete", ".ovw", ovVersRush);
  document.querySelectorAll("#ov-over .ob").forEach(d => d.onclick = () => {
    ouvrir(+d.dataset.t); const b = blocOuvert(), v = $("#v-reel");
    if (v) { rejoue = null; v.pause(); v.currentTime = b.k ? b.a : b.a; }
    dessinerTL();
  });
}
const ovVersRush = x => { const o = OV.find(o => x >= o.x && x < o.x + o.w) || (x < 0 ? OV[0] : OV.at(-1)); return o.a + Math.min(1, Math.max(0, (x - o.x) / o.w)) * (o.b - o.a); };
// la barre rouge qu'on tire : la vidéo suit (en pause), l'image du rush s'affiche au-dessus du doigt (reel bout à bout)
let tireTete = false;
function brancherTete(id, boite, versRush) {
  const el = $(id); if (!el) return;
  el.onpointerdown = ev => {
    ev.preventDefault(); ev.stopPropagation(); el.setPointerCapture(ev.pointerId);
    const v = $("#v-reel"); if (!v) return; rejoue = null; v.pause(); tireTete = true; el.classList.add("tire");
    el.onpointermove = e => {
      const r = $(boite).getBoundingClientRect(), t = Math.min(DUR(), Math.max(0, versRush(Math.min(r.width, Math.max(0, e.clientX - r.left)))));
      v.currentTime = t; const vg = el.querySelector(".vign"), P = E.planche;
      if (vg && P && SPR) { const f = Math.min(P.n - 1, Math.floor(t * P.fps)); vg.style.backgroundImage = "url(/api/planche)"; vg.style.backgroundPosition = `${-(f % P.cols) * P.w}px ${-Math.floor(f / P.cols) * P.h}px`; }
    };
    el.onpointerup = () => { el.onpointermove = null; tireTete = false; el.classList.remove("tire"); };
  };
}
const rushVersOV = t => { if (!OV) return 0; const o = OV.find(o => t >= o.a && t < o.b) || OV.at(-1); return o.x + Math.min(1, (t - o.a) / (o.b - o.a)) * o.w; };

function dessinerTL() {
  if (!$("#tl-cv")) return;
  if (!vue) ouvrir(coupes().length ? coupes()[0].a + 0.01 : 0);
  dessinerLoupe(); dessinerVue();
  const tv = $("#tl-total"); if (tv) tv.textContent = fmt(dureeVirt());
  const m = $("#tl-msg"); if (m) m.innerHTML = msgTL();
  if (E.lab) majBoutonLab();
}
function msgTL() {
  const cs = coupes().map(raison), rep = cs.filter(r => r.rep).length, bl = cs.length - rep;
  if (derushEnCours()) return `<span class="spin"></span>${esc(E.job.nom || "Je coupe ta vidéo")}… elle revient dans quelques secondes.`;
  if (E.lab && labValide()) return msgLab();
  return `<b>1er dérush fait : ${fmt(DUR())} → ${fmt(dureeVirt())}</b> (${rep} reprise${rep > 1 ? "s" : ""}, ${bl} blanc${bl > 1 ? "s" : ""}). Clique un bloc pour le voir en grand : tu remets un bout du gris ou tu retires un mot du bleu.`;
}

// ----- les gestes -----
function remettre(a, b) { DR.plages.push([a, b]); normaliser(); }
function retirer(a, b) { DR.plages = DR.plages.flatMap(([x, y]) => b <= x || a >= y ? [[x, y]] : [[x, a], [b, y]].filter(([u, w]) => w - u > 0.05)); normaliser(); }
function apres(t, quoi) { sel = null; actif = null; drSauver(); dessinerTL(); if (quoi) toast(quoi); if (t != null && DR.plages.length) rejouerAutour(t); }
function agirSel(quoi) {
  if (!sel) return;
  const {a, b} = sel;
  if (quoi === "remettre") { remettre(a, b); apres(a, `Bout remis · ${sec(b - a)}`); }

async function envoyerMusique(f) {

let brollPour = null, brollV = 0;
async function envoyerBroll(f) {
  if (!f || !brollPour) return;

function instantPause() { const v = $("#v-reel"); return v && v.paused && mode === "montage" ? (etape1() ? rushVersVirt(v.currentTime) : v.currentTime) : null; }

const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
$("#mic").onclick = () => {
  if (!Reco) { toast("Dictée indisponible ici : tape ta phrase."); $("#dis").focus(); return; }
  const r = new Reco(); r.lang = "fr-FR"; r.interimResults = true;

// une DEMANDE que Claude fait passer par le Publieur après un OK dans le chat.
const JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
function quandTxt(iso) {
  if (!iso) return "";
  const d = new Date(iso), j0 = new Date(); j0.setHours(0, 0, 0, 0);
  const j = Math.round((new Date(d).setHours(0, 0, 0, 0) - j0) / 864e5);
  const h = d.getHours() + "h" + (d.getMinutes() ? String(d.getMinutes()).padStart(2, "0") : "");
  return (j === 0 ? "aujourd'hui" : j === 1 ? "demain" : JOURS[d.getDay()]) + " " + h;
}
const coches = () => ["reel", ...C().coches.filter(c => c !== "reel" && E.contenus.some(x => x.id === c))];
const COURT = {reel: "Reel", carrousel: "Carrousel", story: "Story"};

  const L = lookVu(), essais = E.contenus.filter(c => c.essai);
  const carte = c => {
    const on = c.id === "reel" || C().coches.includes(c.id), t = tache(c.id);
    const etat = !t ? "" : t.etat === "en cours" ? '<div class="etat"><span class="spin"></span></div>' : t.etat === "fini" ? '<div class="etat ok"><b>✓</b></div>' : t.etat === "erreur" ? '<div class="etat ko">✗</div>' : "";
    let w, h, fond, inner = "", info;
    if (c.id === "reel") { w = 160; h = 284; fond = `/image/1.2`; inner = calques(1.2, hookChoisi(), w); info = `<span class="date" data-quand="reel">${quandTxt(E.cal.reel)}<input type="datetime-local" value="${E.cal.reel}"></span>${c.existe && c.pret ? ` · Gardien ${c.gardien ? "✓" : "à revoir"}` : ""}`; }
    else if (c.type === "carrousel") { w = 140; h = 187; fond = c.existe ? `/sortie/carrousel/1?v=${c.v}` : `/image/${c.t}`; if (!c.existe) inner = `<div class="kw" style="top:12px;font-size:34px">${esc(c.mot)}</div>`; info = `${quandTxt(E.cal.carrousel)} · ${c.slides} slides`; }
    else if (c.type === "story") { w = 110; h = 196; fond = c.existe ? `/sortie/story?v=${c.v}` : `/image/${c.t}`; info = quandTxt(E.cal.story); }
    else { w = 100; h = 178; const t0 = (c.decal || 0) + 1.2; fond = `/image/${t0.toFixed(1)}`; inner = calques(1.2, c.hook, w); info = `<span class="date" data-quand="essais">${quandTxt(E.cal[c.id])}<input type="time" value="${C().prog.essais_heure || "18:00"}"></span>`; }

      ${c.id === "reel" ? "" : `<button class="tog ${on ? "on" : ""}" data-tog="${c.id}" aria-label="Garder ${esc(nom)}" ${fabEnCours() ? "disabled" : ""}></button>`}</div>${esc(nom)}<small>${info}</small></div>`;

  const noms = p.reseaux.map(r => (E.reseaux[r] || r).replace(" Shorts", "").replace("Instagram", "Insta")).join(", ") || "aucun réseau";

  await sauver(v); spick = null; pick = null; mode = "export"; await recharger(true);
  toast("Tout auto : je fabrique ton reel avec mes conseils.");
  lancerTout(["reel"], false);
};
$("#exporter").onclick = () => { finEcoute(); pick = null; mode = "export"; window.scrollTo(0, 0); rendre(); };
$("#retour").onclick = () => { mode = "montage"; rendre(); };

// ---------- état et suivi ----------
function rendre() {
  if (E.lab) { document.body.classList.add("lab"); document.title = "Derush Lab"; $(".brand").lastChild.textContent = "Derush Lab"; }
  $("#proj").textContent = E.lab ? `· ${E.projet.titre} · ${fmt(E.projet.rush)} → ${fmt(dureeVirt())}` : `· ${E.projet.titre} · ${fmt(E.projet.reel)}`;
  rendreSteps(); rendreScene(); rendreFil();
}
// deux signatures : ce qui oblige à recharger la vidéo (scène) et ce qui ne change que la conversation
const sigScene = () => JSON.stringify([mode, E.job.etat, E.job.nom, E.rush_pret, E.projet.clip_v, E.final.v, !!E.publication, E.contenus.map(c => c.v), mode === "export" ? [E.job.taches.map(t => t.etat), E.cal] : 0]);
const sigFil = () => JSON.stringify([E.notes, E.coupes.map(c => c.id + c.etat), E.choix, E.musiques.map(m => m.id), E.look, E.style, E.moments]);
async function recharger(force) {
  const avant = E && [sigScene(), sigFil()];
  E = await api("/api/etat");
  E.musique_v = (E.musiques.find(m => m.id === "perso") || {}).titre || "";
  if (!avant) chargerPolices();
  preparerTexte();
  if (!DR) initDR();
  if (E.planche && !SPR && etape1()) chargerPlanche();
  if (passe() >= 2 && !pick && !spick && !styleFait()) spick = {...STYLE_DEF(), ouvert: "police"};   // étape 2 : 1re vidéo = la galerie des 6 polices
  if ((fabEnCours() || E.publication) && !avant) mode = "export";
  if (force || !avant || avant[0] !== sigScene()) rendre();
  else if (avant[1] !== sigFil()) { rendreSteps(); rendreFil(); majBande(); }
  else if (fabEnCours() && mode === "export") { const s = $(".sous"); if (s) s.textContent = `Je fabrique · ${E.job.taches.filter(t => t.etat === "fini").length} sur ${E.job.taches.length} · ${fmt(Date.now() / 1000 - E.job.debut)}`; }
  clearTimeout(tic);
  // tâche en cours : toutes les 1,5 s ; sinon toutes les 5 s (les réponses de Claude aux notes arrivent pendant que la page est ouverte)
  tic = setTimeout(recharger, E.job.etat === "en cours" ? 1500 : 5000);
}
let redim = null;
addEventListener("resize", () => { clearTimeout(redim); redim = setTimeout(rendreScene, 200); });
(async () => { await recharger(); requestAnimationFrame(boucle); })();
</script>
